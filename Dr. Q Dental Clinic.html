@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B2427;
    --surface: #123238;
    --ink: #E8F5F3;
    --muted: #93B5B8;
    --line: #21474D;
    --accent: #5FD0D6;
    --accent-soft: #1A4248;
    --hover: #174047;
    --veil: rgba(11,36,39,.84);
  }
}
:root[data-theme="dark"] {
  --bg: #0B2427;
  --surface: #123238;
  --ink: #E8F5F3;
  --muted: #93B5B8;
  --line: #21474D;
  --accent: #5FD0D6;
  --accent-soft: #1A4248;
  --hover: #174047;
  --veil: rgba(11,36,39,.84);
}
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body::before {
  content: "";
  position: fixed; inset: -30px;
  z-index: -1;
  background: linear-gradient(var(--veil), var(--veil)), var(--banner) center / cover no-repeat;
  filter: blur(14px);
}
body {
  position: relative;
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: "Tajawal", "Segoe UI", Tahoma, sans-serif;
  display: flex;
  justify-content: center;
}
main {
  width: 100%;
  max-width: 520px;
  padding: 40px 20px 36px;
}
.hero {
  width: 100%;
  aspect-ratio: 1600 / 595;
  border-radius: 20px;
  background: var(--banner) center / cover no-repeat;
  border: 1px solid var(--line);
  box-shadow: 0 8px 30px rgba(14,59,64,.18);
  margin-bottom: 18px;
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
header { text-align: center; margin-bottom: 22px; }
.mark {
  width: 76px; height: 76px;
  margin: 0 auto 16px;
  border-radius: 24px;
  background: var(--accent-soft);
  display: grid; place-items: center;
  color: var(--accent);
}
h1 {
  font-family: "El Messiri", "Tajawal", serif;
  font-weight: 700;
  font-size: 2rem;
  line-height: 1.2;
  margin: 0 0 8px;
  letter-spacing: 0;
}
header p {
  margin: 0;
  color: var(--ink);
  font-weight: 500;
  font-size: 1.1rem;
  line-height: 1.6;
}
nav { display: flex; flex-direction: column; gap: 10px; }
a.link {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  min-height: 68px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  color: inherit;
  text-decoration: none;
  transition: background .15s, border-color .15s, transform .15s;
}
a.link:hover { background: var(--hover); border-color: var(--accent); }
a.link:active { transform: scale(.985); }
a.link:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.ico {
  flex: none;
  width: 44px; height: 44px;
  border-radius: 14px;
  background: var(--accent-soft);
  color: var(--accent);
  display: grid; place-items: center;
}
.ico svg { width: 24px; height: 24px; }
.txt { flex: 1; min-width: 0; }
.txt strong { display: block; font-size: 1.1rem; font-weight: 700; }
.txt span { display: block; font-size: .92rem; color: var(--muted); margin-top: 2px; }
.chev { flex: none; color: var(--muted); width: 20px; height: 20px; }
a.link.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
a.link.primary .ico { background: rgba(255,255,255,.2); color: #fff; }
a.link.primary .txt span, a.link.primary .chev { color: rgba(255,255,255,.85); }
a.link.primary:hover { filter: brightness(1.06); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) a.link.primary { color: #06292C; }
  :root:not([data-theme="light"]) a.link.primary .ico { background: rgba(6,41,44,.18); color: #06292C; }
  :root:not([data-theme="light"]) a.link.primary .txt span,
  :root:not([data-theme="light"]) a.link.primary .chev { color: rgba(6,41,44,.8); }
}
:root[data-theme="dark"] a.link.primary { color: #06292C; }
:root[data-theme="dark"] a.link.primary .ico { background: rgba(6,41,44,.18); color: #06292C; }
:root[data-theme="dark"] a.link.primary .txt span,
:root[data-theme="dark"] a.link.primary .chev { color: rgba(6,41,44,.8); }
@media (prefers-reduced-motion: reduce) { a.link { transition: none; } }
</style>
